<!DOCTYPE html>
<html>
<head>
  <base href="/Sejel_Kashfe/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sejel_kashfe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sejel_kashfe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Full-screen black background */
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    /* Simple loading spinner */
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide flutter app until loaded */
    #flutter_container {
      display: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading_screen">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- Flutter app will attach here -->
  <div id="flutter_container"></div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Wait for Flutter to load
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading_screen').style.display = 'none';
      document.getElementById('flutter_container').style.display = 'block';
    });
  </script>
</body>
</html>
